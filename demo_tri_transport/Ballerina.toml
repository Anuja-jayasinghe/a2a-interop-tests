[package]
org = "anuja_j"
name = "a2a_tri_transport_demo"
version = "0.1.0"
distribution = "2201.13.4"

[build-options]
observabilityIncluded = true

[[dependency]]
org = "ballerina"
name = "a2a"
version = "0.2.0"
repository = "local"

# Pinned to match what ballerina/grpc 1.14.7 (pulled in transitively by
# a2a's gRPC transport binding) was actually compiled against -- see
# servers/dice_agent/findings.md #6. Only takes effect combined with
# http_version_pin.bal's direct import, and only holds with
# `bal build/run --sticky`.
[[dependency]]
org = "ballerina"
name = "http"
version = "2.14.13"
