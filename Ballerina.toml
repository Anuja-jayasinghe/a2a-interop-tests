[package]
org = "anuja_j"
name = "a2a_interop_tests"
version = "0.1.0"
distribution = "2201.13.4"

[build-options]
observabilityIncluded = true

[[dependency]]
org = "ballerina"
name = "a2a"
version = "0.2.1"
repository = "local"

# Pinned to match what ballerina/grpc 1.14.7 (pulled in transitively by
# a2a's gRPC transport binding) was actually compiled against -- grpc
# doesn't declare a Ballerina-level dependency on http at all (its native
# Java code calls HttpLogManager directly), so left unpinned the resolver
# picks the newest http on central (2.16.6), which is binary-incompatible
# and fails at runtime with an IllegalAccessError, not a build error.
[[dependency]]
org = "ballerina"
name = "http"
version = "2.14.13"
